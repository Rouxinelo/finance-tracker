name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: finance-tracker

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve SPM
        run: xcodebuild -resolvePackageDependencies -project finance-tracker.xcodeproj
        
      - name: Build
        run: |
          xcodebuild \
            -project finance-tracker.xcodeproj \
            -scheme finance-tracker \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            build
            
  test:
    runs-on: macos-latest
    needs: build
    defaults:
      run:
        working-directory: finance-tracker
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
        
      - name: Test
        run: |
          xcodebuild \
            -project finance-tracker.xcodeproj \
            -scheme finance-tracker \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,OS=18.5,name=iPhone 16' \
            -skip-testing:finance-trackerUITests \
            -skip-testing:finance-trackerTests/finance-trackerLaunchTests \
            test

